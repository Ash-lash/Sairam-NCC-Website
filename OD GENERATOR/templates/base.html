<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        OD Generator
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<header class="navbar">

    <div class="logo">
        OD GENERATOR
    </div>


    <nav>

        <a href="{{ url_for('generate') }}">
            Generate OD
        </a>

        <a href="{{ url_for('students') }}">
            Student Database
        </a>

    </nav>

</header>


<main class="container">


{% with messages = get_flashed_messages(
    with_categories=true
) %}

    {% for category, message in messages %}

        <div class="flash {{ category }}">

            {{ message }}

        </div>

    {% endfor %}

{% endwith %}


{% block content %}

{% endblock %}


</main>


</body>

</html>
